[workspace]
resolver = "3"
members = [
    "crates/tjuaeui-assets",
    "crates/tjuaeui-common",
    "crates/tjuaeui-db",
    "crates/tjuaeui-api-types",
    "crates/tjuaeui-realtime",
    "crates/tjuaeui-runtime",
    "crates/tjuaeui-process",
    "crates/tjuaeui-session",
    "crates/tjuaeui-auth",
    "crates/tjuaeui-system",
    "crates/tjuaeui-file",
    "crates/tjuaeui-office",
    "crates/tjuaeui-shell",
    "crates/tjuaeui-ai-agent",
    "crates/tjuaeui-mcp",
    "crates/tjuaeui-conversation",
    "crates/tjuaeui-catalog",
    "crates/tjuaeui-extension",
    "crates/tjuaeui-channel",
    "crates/tjuaeui-team-prompts",
    "crates/tjuaeui-team",
    "crates/tjuaeui-project",
    "crates/tjuaeui-cron",
    "crates/tjuaeui-assistant",
    "crates/tjuaeui-app",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Tjuae"]
repository = "https://github.com/liangboqiang/TjuaeCore"

[workspace.dependencies]
# Internal crates
tjuaeui-common = { path = "crates/tjuaeui-common" }
tjuaeui-assets = { path = "crates/tjuaeui-assets" }
tjuaeui-db = { path = "crates/tjuaeui-db" }
tjuaeui-api-types = { path = "crates/tjuaeui-api-types" }
tjuaeui-realtime = { path = "crates/tjuaeui-realtime" }
tjuaeui-runtime = { path = "crates/tjuaeui-runtime" }
tjuaeui-process = { path = "crates/tjuaeui-process" }
tjuaeui-session = { path = "crates/tjuaeui-session" }
tjuaeui-auth = { path = "crates/tjuaeui-auth" }
tjuaeui-system = { path = "crates/tjuaeui-system" }
tjuaeui-file = { path = "crates/tjuaeui-file" }
tjuaeui-office = { path = "crates/tjuaeui-office" }
tjuaeui-shell = { path = "crates/tjuaeui-shell" }
tjuaeui-ai-agent = { path = "crates/tjuaeui-ai-agent" }
tjuaeui-mcp = { path = "crates/tjuaeui-mcp" }
tjuaeui-conversation = { path = "crates/tjuaeui-conversation" }
tjuaeui-catalog = { path = "crates/tjuaeui-catalog" }
tjuaeui-extension = { path = "crates/tjuaeui-extension" }
tjuaeui-channel = { path = "crates/tjuaeui-channel" }
tjuaeui-team-prompts = { path = "crates/tjuaeui-team-prompts" }
tjuaeui-team = { path = "crates/tjuaeui-team" }
tjuaeui-project = { path = "crates/tjuaeui-project" }
tjuaeui-cron = { path = "crates/tjuaeui-cron" }
tjuaeui-assistant = { path = "crates/tjuaeui-assistant" }
tjuaeui-app = { path = "crates/tjuaeui-app" }

tjuae-agent = { git = "https://github.com/liangboqiang/TjuaeCLI.git", rev = "5aacdea2499327d3e79b8f2350acb8caff6db9e7" }
tjuae-providers = { git = "https://github.com/liangboqiang/TjuaeCLI.git", rev = "5aacdea2499327d3e79b8f2350acb8caff6db9e7" }
tjuae-types = { git = "https://github.com/liangboqiang/TjuaeCLI.git", rev = "5aacdea2499327d3e79b8f2350acb8caff6db9e7" }
tjuae-protocol = { git = "https://github.com/liangboqiang/TjuaeCLI.git", rev = "5aacdea2499327d3e79b8f2350acb8caff6db9e7" }
tjuae-config = { git = "https://github.com/liangboqiang/TjuaeCLI.git", rev = "5aacdea2499327d3e79b8f2350acb8caff6db9e7" }
tjuae-mcp = { git = "https://github.com/liangboqiang/TjuaeCLI.git", rev = "5aacdea2499327d3e79b8f2350acb8caff6db9e7" }

# Core framework
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
http = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Async utilities
futures-util = "0.3"

# Async trait (dyn-compatible async traits)
async-trait = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# Auth / Crypto
jsonwebtoken = "9"
bcrypt = "0.17"
aes-gcm = "0.10"

# UUID
uuid = { version = "1", features = ["v7"] }
url = "2"

# HTTP client — use rustls with native roots to align backend trust with the host system.
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls-native-roots"], default-features = false }

# Concurrency
dashmap = "6"

# WebSocket
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }

# Protobuf
prost = "0.13"

# Semver
semver = "1"

# Directories
dirs = "6"

# Regex
regex = "1"

# File system
include_dir = "0.7"
notify = "8"
walkdir = "2"
ignore = "0.4"
zip = "2"
git2 = { version = "0.20", default-features = false }
mime_guess = "2"
rust-embed = "8"

# Runtime embedding
fs2 = "0.4"
zstd = "0.13"

# Cron
cron = "0.15"
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"

# Shell
open = "5"
which = "7"

# Office
calamine = "0.36"
rust_xlsxwriter = "0.82"
sha1 = "0.10"
sha2 = "0.10"

# AWS
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-bedrock = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }

# TLS
rustls = "0.23"
rustls-native-certs = "0.8"

# Pin rustls-webpki to fix RUSTSEC-2026-{0098,0099,0104}
rustls-webpki = "0.103.13"

# OAuth / MCP
oauth2 = "5.0.0-rc.1"
toml = "0.8"

# Ed25519
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Encoding
base64 = "0.22"

# HTTP body utilities (testing)
http-body-util = "0.1"

# Testing
tempfile = "3"
wiremock = "0.6"
proptest = "1"

# Random
getrandom = "0.2"
hex = "0.4"
libc = "0.2"

# Shrink target/debug: minimal debuginfo, sidecar files, no incremental cache.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false
