name: 发布

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag_name:
        description: "要构建并发布的标签（例如 v0.3.1）"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "要构建并发布的标签（例如 v0.3.1）"
        required: true
        type: string

permissions:
  contents: write

env:
  BINARY_NAME: tjuaecore
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"
  # Linux ARM64 发布构建使用的固定 cross 提交。
  CROSS_GIT_REV: "29d00c7803f221f1b3f35e561b03792368fb8339"
  LINUX_X64_GLIBC_MAX: "GLIBC_2.34"
  LINUX_ARM64_GLIBC_MAX: "GLIBC_2.30"
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
  # GitHub App client ID 是公开标识，通过仓库变量注入最终二进制。
  TJUAE_GITHUB_APP_CLIENT_ID: ${{ vars.TJUAE_GITHUB_APP_CLIENT_ID }}
  # App 安装页也是公开配置，用于未安装时引导用户完成前置条件。
  TJUAE_GITHUB_APP_INSTALLATION_URL: ${{ vars.TJUAE_GITHUB_APP_INSTALLATION_URL }}

jobs:
  prepare-release:
    name: 准备发布元数据
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: 从标签提取版本号
        id: metadata
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64：在 ubuntu-22.04（GLIBC 2.35）上原生构建，使发布
          # 二进制文件可在 Debian 12、Ubuntu 22.04+、RHEL 9 和 CentOS
          # Stream 9 上运行。此处不能使用 `cross`，因为其默认 Docker 镜像
          # 携带的 gcc 无法通过 aws-lc-sys 的 memcmp 安全检查。固定运行器
          # 更简单，也能覆盖目标用户；Debian 11（GLIBC 2.31）即将进入
          # ELTS，因此不再支持。
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_name: tjuaecore
          # Linux aarch64：继续使用 `cross`；该镜像能通过 aws-lc-sys 检查，
          # 并可生成采用更低 GLIBC 基线的二进制文件。
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: tjuaecore
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: tjuaecore
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: tjuaecore
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: tjuaecore.exe
            rustflags: "-C target-feature=+crt-static"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: tjuaecore.exe
            rustflags: "-C target-feature=+crt-static"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: 验证发布服务构建配置
        shell: bash
        run: |
          if [[ -z "${TJUAE_GITHUB_APP_CLIENT_ID//[[:space:]]/}" ]] || [[ "${TJUAE_GITHUB_APP_CLIENT_ID}" =~ [[:space:]] ]]; then
            echo "::error::请在 TjuaeCore 仓库变量中配置非空且不含空白的 TJUAE_GITHUB_APP_CLIENT_ID。"
            exit 1
          fi
          if [[ ! "${TJUAE_GITHUB_APP_INSTALLATION_URL}" =~ ^https://github\.com/apps/[A-Za-z0-9-]+/installations/new$ ]]; then
            echo "::error::请在 TjuaeCore 仓库变量中配置合法的 TJUAE_GITHUB_APP_INSTALLATION_URL。"
            exit 1
          fi

      - name: 修复 MSVC 链接器（移除 Git 的 link.exe）
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # 缓存键需包含运行器操作系统镜像和 cross 基线。过程宏 .so 文件会
          # 链接宿主机 GLIBC，因此切换运行器（ubuntu-24.04 ↔ 22.04）或在
          # 原生构建与 cross 之间切换时，必须使用不同缓存；否则缓存的 .so
          # 会由不兼容的 GLIBC 加载，导致 Cargo 因找不到 crate 或 GLIBC
          # 版本而崩溃。
          shared-key: release-${{ matrix.target }}-${{ matrix.os }}${{ matrix.target == 'x86_64-unknown-linux-gnu' && format('-glibc-{0}', env.LINUX_X64_GLIBC_MAX) || '' }}${{ matrix.use_cross == true && format('-cross-{0}-glibc-{1}', env.CROSS_GIT_REV, env.LINUX_ARM64_GLIBC_MAX) || '' }}

      - name: 验证固定的 Linux ARM64 cross 镜像可用
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: docker pull ghcr.io/cross-rs/aarch64-unknown-linux-gnu@sha256:99e041b94e7d4f31477c6ddede176688562c3762ba3833b75de3316100afc39d

      - name: 安装 cross（Linux 目标）
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross --rev "${CROSS_GIT_REV}" --locked

      - name: 构建发布二进制文件
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        run: |
          if [[ -n "${RUSTFLAGS:-}" ]]; then
            echo "使用 RUSTFLAGS=${RUSTFLAGS}"
          fi
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --target ${{ matrix.target }} -p tjuaeui-app
          else
            cargo build --release --target ${{ matrix.target }} -p tjuaeui-app
          fi

      - name: 验证 Linux ARM64 GLIBC 基线
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: scripts/check-glibc-baseline.sh "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${LINUX_ARM64_GLIBC_MAX}"

      - name: 验证 Linux x64 GLIBC 基线
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: scripts/check-glibc-baseline.sh "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${LINUX_X64_GLIBC_MAX}"

      - name: 打包二进制文件（Unix）
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          mkdir -p dist
          ARCHIVE="tjuaecore-v${VERSION}-${{ matrix.target }}.tar.gz"
          tar -C target/${{ matrix.target }}/release -czf "dist/${ARCHIVE}" ${{ matrix.binary_name }}
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: 打包二进制文件（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "tjuaecore-v${env:VERSION}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -DestinationPath "dist/${archive}" -Force
          "ARCHIVE=${archive}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 上传发布产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/${{ env.ARCHIVE }}
          if-no-files-found: error

  github-release:
    name: 上传 GitHub Release 资产
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        shell: bash
        run: |
          cd artifacts
          sha256sum tjuaecore-* > tjuaecore-checksums.txt

      - name: 上传发布资产
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          release_url="https://github.com/${REPOSITORY}/releases/tag/${RELEASE_TAG}"
          if gh release view "${RELEASE_TAG}" --repo "${REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" artifacts/* --repo "${REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" artifacts/* \
              --repo "${REPOSITORY}" \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
          echo "已将资产上传至 ${release_url}"
