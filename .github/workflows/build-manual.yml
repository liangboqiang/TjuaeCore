name: "🔨 手动构建"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "要构建的分支、标签或提交"
        required: true
        default: "main"
        type: string
      platform:
        description: "构建平台"
        required: true
        type: choice
        options:
          - macos-arm64
          - macos-x64
          - windows-x64
          - windows-arm64
          - linux-x64
          - linux-arm64
          - all
        default: "macos-arm64"

permissions:
  contents: read

env:
  BINARY_NAME: tjuaecore
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"
  # Linux ARM64 发布构建使用的固定 cross 提交。
  CROSS_GIT_REV: "29d00c7803f221f1b3f35e561b03792368fb8339"
  LINUX_X64_GLIBC_MAX: "GLIBC_2.34"
  LINUX_ARM64_GLIBC_MAX: "GLIBC_2.30"
  # GitHub App client ID 是公开标识，通过仓库变量注入最终二进制。
  TJUAE_GITHUB_APP_CLIENT_ID: ${{ vars.TJUAE_GITHUB_APP_CLIENT_ID }}
  TJUAE_GITHUB_APP_INSTALLATION_URL: ${{ vars.TJUAE_GITHUB_APP_INSTALLATION_URL }}

jobs:
  prepare-matrix:
    name: 准备构建矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: 生成构建矩阵
        id: set-matrix
        shell: bash
        run: |
          PLATFORM="${{ inputs.platform }}"

          MACOS_ARM64='{"platform":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin","binary_name":"tjuaecore","artifact_name":"tjuaecore-manual-macos-arm64","use_cross":false}'
          MACOS_X64='{"platform":"macos-x64","os":"macos-latest","target":"x86_64-apple-darwin","binary_name":"tjuaecore","artifact_name":"tjuaecore-manual-macos-x64","use_cross":false}'
          WINDOWS_X64='{"platform":"windows-x64","os":"windows-latest","target":"x86_64-pc-windows-msvc","binary_name":"tjuaecore.exe","artifact_name":"tjuaecore-manual-windows-x64","rustflags":"-C target-feature=+crt-static","use_cross":false}'
          WINDOWS_ARM64='{"platform":"windows-arm64","os":"windows-latest","target":"aarch64-pc-windows-msvc","binary_name":"tjuaecore.exe","artifact_name":"tjuaecore-manual-windows-arm64","rustflags":"-C target-feature=+crt-static","use_cross":false}'
          LINUX_X64='{"platform":"linux-x64","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","binary_name":"tjuaecore","artifact_name":"tjuaecore-manual-linux-x64","use_cross":false}'
          LINUX_ARM64='{"platform":"linux-arm64","os":"ubuntu-latest","target":"aarch64-unknown-linux-gnu","binary_name":"tjuaecore","artifact_name":"tjuaecore-manual-linux-arm64","use_cross":true}'

          if [ "$PLATFORM" = "all" ]; then
            MATRIX="{\"include\":[$MACOS_ARM64,$MACOS_X64,$WINDOWS_X64,$WINDOWS_ARM64,$LINUX_X64,$LINUX_ARM64]}"
          elif [ "$PLATFORM" = "macos-arm64" ]; then
            MATRIX="{\"include\":[$MACOS_ARM64]}"
          elif [ "$PLATFORM" = "macos-x64" ]; then
            MATRIX="{\"include\":[$MACOS_X64]}"
          elif [ "$PLATFORM" = "windows-x64" ]; then
            MATRIX="{\"include\":[$WINDOWS_X64]}"
          elif [ "$PLATFORM" = "windows-arm64" ]; then
            MATRIX="{\"include\":[$WINDOWS_ARM64]}"
          elif [ "$PLATFORM" = "linux-x64" ]; then
            MATRIX="{\"include\":[$LINUX_X64]}"
          elif [ "$PLATFORM" = "linux-arm64" ]; then
            MATRIX="{\"include\":[$LINUX_ARM64]}"
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "已为平台 '$PLATFORM' 生成构建矩阵："
          echo "$MATRIX" | python3 -m json.tool

  build:
    name: 构建 ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: 获取提交哈希
        id: commit
        shell: bash
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "提交：$SHORT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: 验证发布服务构建配置
        shell: bash
        run: |
          if [[ -z "${TJUAE_GITHUB_APP_CLIENT_ID//[[:space:]]/}" ]] || [[ "${TJUAE_GITHUB_APP_CLIENT_ID}" =~ [[:space:]] ]]; then
            echo "::error::请在 TjuaeCore 仓库变量中配置非空且不含空白的 TJUAE_GITHUB_APP_CLIENT_ID。"
            exit 1
          fi
          if [[ ! "${TJUAE_GITHUB_APP_INSTALLATION_URL}" =~ ^https://github\.com/apps/[A-Za-z0-9-]+/installations/new$ ]]; then
            echo "::error::请在 TjuaeCore 仓库变量中配置合法的 TJUAE_GITHUB_APP_INSTALLATION_URL。"
            exit 1
          fi

      - name: 修复 MSVC 链接器（移除 Git 的 link.exe）
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: manual-build-${{ matrix.target }}-${{ matrix.os }}${{ matrix.target == 'x86_64-unknown-linux-gnu' && format('-glibc-{0}', env.LINUX_X64_GLIBC_MAX) || '' }}${{ matrix.use_cross == true && format('-cross-{0}-glibc-{1}', env.CROSS_GIT_REV, env.LINUX_ARM64_GLIBC_MAX) || '' }}

      - name: 验证固定的 Linux ARM64 cross 镜像可用
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: docker pull ghcr.io/cross-rs/aarch64-unknown-linux-gnu@sha256:99e041b94e7d4f31477c6ddede176688562c3762ba3833b75de3316100afc39d

      - name: 安装 cross（Linux 目标）
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross --rev "${CROSS_GIT_REV}" --locked

      - name: 构建发布二进制文件
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        run: |
          if [[ -n "${RUSTFLAGS:-}" ]]; then
            echo "使用 RUSTFLAGS=${RUSTFLAGS}"
          fi

          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --target ${{ matrix.target }} -p tjuaeui-app
          else
            cargo build --release --target ${{ matrix.target }} -p tjuaeui-app
          fi

      - name: 验证 Linux ARM64 GLIBC 基线
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: scripts/check-glibc-baseline.sh "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${LINUX_ARM64_GLIBC_MAX}"

      - name: 验证 Linux x64 GLIBC 基线
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: scripts/check-glibc-baseline.sh "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${LINUX_X64_GLIBC_MAX}"

      - name: 打包二进制文件（Unix）
        if: runner.os != 'Windows'
        shell: bash
        env:
          COMMIT_SHORT: ${{ steps.commit.outputs.short }}
        run: |
          mkdir -p dist
          ARCHIVE="tjuaecore-${COMMIT_SHORT}-${{ matrix.target }}.tar.gz"
          tar -C target/${{ matrix.target }}/release -czf "dist/${ARCHIVE}" ${{ matrix.binary_name }}
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: 打包二进制文件（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          COMMIT_SHORT: ${{ steps.commit.outputs.short }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "tjuaecore-${env:COMMIT_SHORT}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -DestinationPath "dist/${archive}" -Force
          "ARCHIVE=${archive}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 上传手动构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

  build-summary:
    name: 构建摘要
    runs-on: ubuntu-latest
    needs:
      - prepare-matrix
      - build
    if: always()

    steps:
      - name: 写入构建摘要
        env:
          MATRIX: ${{ needs.prepare-matrix.outputs.matrix }}
        run: |
          PLATFORMS=$(echo "$MATRIX" | jq -r '[.include[].platform] | join(", ")')
          ARTIFACTS=$(echo "$MATRIX" | jq -r '[.include[].artifact_name] | join(", ")')

          echo "## TjuaeCore 手动构建" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 键 | 值 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 引用 | \`${{ inputs.branch }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 平台 | \`${PLATFORMS}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 产物 | \`${ARTIFACTS}\` |" >> "$GITHUB_STEP_SUMMARY"
